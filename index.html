<!DOCTYPE html>

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }
        
        /* 首页 */
        .welcome {
            padding: 60px 40px;
            text-align: center;
        }
        
        .welcome h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .welcome p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .pets-showcase {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .pet-emoji {
            font-size: 40px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        /* 答题页面 */
        .quiz {
            padding: 40px;
            display: none;
        }
        
        .quiz-header {
            margin-bottom: 30px;
        }
        
        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        
        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
        }
        
        .question {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 18px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            text-align: left;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }
        
        /* 结果页面 */
        .result {
            padding: 40px;
            text-align: center;
            display: none;
        }
        
        .result-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .pet-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
            margin: 20px auto;
            display: block;
            background: #f0f0f0;
        }
        
        .pet-name {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .pet-type {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .pet-description {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
        }
        
        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .share-text {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
            word-break: break-all;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .welcome h1 { font-size: 26px; }
            .question { font-size: 20px; }
            .container { border-radius: 20px; }
            .quiz, .welcome, .result { padding: 30px 20px; }
        }
    </style>
</head>

        let currentQuestion = 0;
        let answers = [];
        
        function startQuiz() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('quiz').classList.add('fade-in');
            showQuestion();
        }
        
        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question').textContent = q.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('progress').style.width = ((currentQuestion + 1) / 8 * 100) + '%';
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectAnswer(index);
                optionsDiv.appendChild(btn);
            });
        }
        
        function selectAnswer(index) {
            answers.push(index);
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        
        // 核心算法：将答案映射到宠物
        function calculatePet() {
            // 使用加权和 + 哈希确保同样的答案总是得到同样的结果
            let hash = 0;
            
            for (let i = 0; i < answers.length; i++) {
                // 不同题目有不同的权重
                const weights = [3, 2, 3, 1, 2, 1, 2, 1];
                hash += answers[i] * weights[i];
            }
            
            // 加上每个答案的平方（增加独特性）
            for (let i = 0; i < answers.length; i++) {
                hash += answers[i] * answers[i] * (i + 1);
            }
            
            // 取模得到 0-19 的索引
            return hash % 20;
        }

                    '<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250">' +
                    '<rect fill="#f0f0f0" width="250" height="250"/>' +
                    '<text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="100">' + emoji + '</text>' +
                    '</svg>'
                );
                img.style.background = '#f0f0f0';
            };
            testImg.src = pet.image;
            document.getElementById('petImage').alt = pet.name;
            document.getElementById('petName').textContent = pet.name;
            document.getElementById('petType').textContent = pet.type;
            document.getElementById('petDescription').textContent = pet.description;
            
            // 生成分享文本
            const shareText = `我的命中注定宠物是【${pet.name}】！快来测测你的：${window.location.href}`;
            document.getElementById('shareText').textContent = '分享语：' + shareText;
            
            // 保存结果到 localStorage（可选）
            localStorage.setItem('petResult', JSON.stringify({
                petIndex: petIndex,
                answers: answers,
                date: new Date().toISOString()
            }));
        }
        
        function restart() {
            currentQuestion = 0;
            answers = [];
            document.getElementById('result').style.display = 'none';
            document.getElementById('welcome').style.display = 'block';
            document.getElementById('welcome').classList.add('fade-in');
        }
        
        function copyResult() {
            const shareText = document.getElementById('shareText').textContent.replace('分享语：', '');
            navigator.clipboard.writeText(shareText).then(() => {
                alert('结果已复制到剪贴板！');
            }).catch(() => {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = shareText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('结果已复制！');
            });
        }
        
        // 页面加载时检查是否有之前的结果（可选功能）
        window.onload = function() {
            const saved = localStorage.getItem('petResult');
            if (saved) {
                const data = JSON.parse(saved);
                console.log('之前测过：', pets[data.petIndex].name);
            }
        };
    </script>
</body>
</html>
